name: File-size budget

# Ratchet: no new source file over the line limit, and no baselined file may
# grow. Baseline and limit live in file-size-budget.json.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  file-size-budget:
    name: "file-size-budget"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
      - name: Check file sizes
        run: node scripts/check-file-size.mjs
